services:
    mariadb:
        image: mariadb:11
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-rootpassword}}"
            MARIADB_DATABASE: "${MARIADB_DATABASE:-${MYSQL_DATABASE:-opensim}}"
            MARIADB_USER: "${MARIADB_USER:-${MYSQL_USER:-opensim}}"
            MARIADB_PASSWORD: "${MARIADB_PASSWORD:-${MYSQL_PASSWORD:-opensimpassword}}"
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
        volumes:
            - opensim-mariadb:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mariadb-admin ping -h localhost -u root --password="$$MARIADB_ROOT_PASSWORD" --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    spawner:
        image: "${OPENSIM_SPAWNER_IMAGE:-opensim-spawner:local}"
        build:
            context: ../opensim-spawner
            dockerfile: Dockerfile
        restart: unless-stopped
        pull_policy: "${OPENSIM_PULL_POLICY:-missing}"
        environment:
            OPENSIM_HOSTNAME: "${OPENSIM_HOSTNAME:-opensim}"
            OPENSIM_USER_EMAIL: "${OPENSIM_USER_EMAIL:-admin@example.com}"
            OPENSIM_ESTATE_NAME: "${OPENSIM_ESTATE_NAME:-Botland}"
            OPENSIM_REGION_X: "${OPENSIM_REGION_X:-1000}"
            OPENSIM_REGION_Y: "${OPENSIM_REGION_Y:-1000}"
            OPENSIM_ESTATE_ARCHIVE: "${OPENSIM_ESTATE_ARCHIVE:-blank}"
            OPENSIM_USER_FIRST: "${OPENSIM_USER_FIRST:-Bot}"
            OPENSIM_USER_LAST: "${OPENSIM_USER_LAST:-Handler}"
            OPENSIM_USER_PASSWORD: "${OPENSIM_USER_PASSWORD:-changeme}"
            OPENSIM_WELCOME_MESSAGE: "${OPENSIM_WELCOME_MESSAGE:-Welcome to ${OPENSIM_GRID_NAME:-Bot Grid}!}"
            MARIADB_HOST: "${MARIADB_HOST:-mariadb}"
            MARIADB_DATABASE: "${MARIADB_DATABASE:-opensim}"
            MARIADB_USER: "${MARIADB_USER:-opensim}"
            MARIADB_PASSWORD: "${MARIADB_PASSWORD:-opensimpassword}"
            OPENSIM_WEBRTC_VOICE_ENABLED: "${OPENSIM_WEBRTC_VOICE_ENABLED:-true}"
            OPENSIM_JANUS_PUBLIC_HOST: "${OPENSIM_JANUS_PUBLIC_HOST:-${OPENSIM_HOSTNAME:-opensim}}"
            JANUS_HTTP_PORT: "${JANUS_HTTP_PORT:-14223}"
            JANUS_HTTP_BASEPATH: "${JANUS_HTTP_BASEPATH:-/voice}"
            JANUS_API_TOKEN: "${JANUS_API_TOKEN:-}"
            JANUS_HTTP_ADMIN_PORT: "${JANUS_HTTP_ADMIN_PORT:-14225}"
            JANUS_HTTP_ADMIN_BASEPATH: "${JANUS_HTTP_ADMIN_BASEPATH:-/voiceAdmin}"
            JANUS_ADMIN_TOKEN: "${JANUS_ADMIN_TOKEN:-}"
            OPENSIM_ROBUST_PUBLIC_PORT: "${OPENSIM_ROBUST_PUBLIC_PORT:-8002}"
            OPENSIM_ROBUST_PRIVATE_PORT: "${OPENSIM_ROBUST_PRIVATE_PORT:-8003}"
            OPENSIM_GRID_NAME: "${OPENSIM_GRID_NAME:-Bot Grid}"
            OPENSIM_GRID_NICK: "${OPENSIM_GRID_NICK:-botgrid}"
            OPENSIM_PULL_POLICY: "${OPENSIM_PULL_POLICY:-missing}"
            OPENSIM_RESTART_POLICY: "${OPENSIM_RESTART_POLICY:-unless-stopped}"
            OPENSIM_CREATE_BOT_USER: "${OPENSIM_CREATE_BOT_USER:-true}"
            OPENSIM_BOT_FIRST: "${OPENSIM_BOT_FIRST:-Bot}"
            OPENSIM_BOT_LAST: "${OPENSIM_BOT_LAST:-User}"
            OPENSIM_BOT_EMAIL: "${OPENSIM_BOT_EMAIL:-bot@localhost}"
            OPENSIM_BOT_APPEARANCE: "${OPENSIM_BOT_APPEARANCE:-Cube Bot}"
            OPENSIM_BOT_GENDER: "${OPENSIM_BOT_GENDER:-neutral}"
            OPENSIM_LOGIN_URI: "${OPENSIM_LOGIN_URI:-http://${OPENSIM_GRID_SERVICES:-${COMPOSE_PROJECT_NAME:-opensim-ai}-grid-services}:9000}"
            OPENSIM_LOGIN_START: "${OPENSIM_LOGIN_START:-last}"
            OPENSIM_SPAWNER_HTTP_HOST: "${OPENSIM_SPAWNER_HTTP_HOST:-0.0.0.0}"
            OPENSIM_SPAWNER_HTTP_PORT: "${OPENSIM_SPAWNER_HTTP_PORT:-8993}"
            OPENSIM_SPAWNER_TOKEN: "${OPENSIM_SPAWNER_TOKEN:-}"
            OPENSIM_SPAWNER_FIRST_PORT: "${OPENSIM_SPAWNER_FIRST_PORT:-9000}"
            OPENSIM_CONSOLE_URL: "${OPENSIM_CONSOLE_URL:-http://${OPENSIM_GRID_SERVICES:-${COMPOSE_PROJECT_NAME:-opensim-ai}-grid-services}:9000}"
            OPENSIM_CONSOLE_USER: "${OPENSIM_CONSOLE_USER:-ConsoleUser}"
            OPENSIM_CONSOLE_PASS: "${OPENSIM_CONSOLE_PASS:-ConsolePass}"
            SPAWNER_HOST: "${SPAWNER_HOST:-${COMPOSE_PROJECT_NAME:-opensim-ai}-spawner-1}"
            OPENSIM_METAVERSE2MCP_IMAGE: "${OPENSIM_METAVERSE2MCP_IMAGE:-bithatch/opensim-metaverse2mcp:latest}"
            OPENSIM_SIMULATOR_IMAGE: "${OPENSIM_SIMULATOR_IMAGE:-bithatch/opensim-simulator:latest}"
            OPENSIM_OPENCODE_IMAGE: "${OPENSIM_OPENCODE_IMAGE:-bithatch/opensim-opencode:latest}"
            VOICE_ROUTING_ENABLED: "${VOICE_ROUTING_ENABLED:-true}"
            VOICE_BACKEND: "${VOICE_BACKEND:-webrtc}"
            PIPER_SCHEME: "${PIPER_SCHEME:-http}"
            PIPER_HOST: "${PIPER_HOST:-${COMPOSE_PROJECT_NAME:-opensim-ai}-piper-1}"
            PIPER_PORT: "${PIPER_PORT:-8995}"
            PIPER_TTS_PATH: "${PIPER_TTS_PATH:-/tts}"
            PIPER_VOICES_PATH: "${PIPER_VOICES_PATH:-/voices}"
            PIPER_REQUEST_TIMEOUT_SECONDS: "${PIPER_REQUEST_TIMEOUT_SECONDS:-60}"
            PIPER_DEFAULT_VOICE: "${PIPER_DEFAULT_VOICE:-en_US-lessac-medium}"
            METAVERSE_MCP_TRANSPORT: "${METAVERSE_MCP_TRANSPORT:-http}"
            METAVERSE_MCP_HOST: "${METAVERSE_MCP_HOST:-0.0.0.0}"
            METAVERSE_MCP_PORT: "${METAVERSE_MCP_PORT:-8999}"
            METAVERSE_MCP_HTTP_ENDPOINT: "${METAVERSE_MCP_HTTP_ENDPOINT:-/mcp}"
            METAVERSE_MCP_HTTP_DISALLOW_DELETE: "${METAVERSE_MCP_HTTP_DISALLOW_DELETE:-false}"
            METAVERSE_MCP_DIAGNOSTICS: "${METAVERSE_MCP_DIAGNOSTICS:-false}"
            OPENSIM_LOGIN_TIMEOUT_SECONDS: "${OPENSIM_LOGIN_TIMEOUT_SECONDS:-30}"
            CONSOLE_MCP_PORT: "${CONSOLE_MCP_PORT:-8997}"
            CONSOLE_MCP_HTTP_ENDPOINT: "${CONSOLE_MCP_HTTP_ENDPOINT:-/mcp}"
            CONSOLE_MCP_HTTP_BEARER_TOKEN: "${CONSOLE_MCP_HTTP_BEARER_TOKEN}"
            OPENCODE_SCHEME: "${OPENCODE_SCHEME:-http}"
            OPENCODE_HOST: "${OPENCODE_CHAT_HOST:-0.0.0.0}"
            OPENCODE_PORT: "${OPENCODE_CHAT_PORT:-${OPENCODE_PORT:-8998}}"
            OPENCODE_REQUEST_TIMEOUT_SECONDS: "${OPENCODE_REQUEST_TIMEOUT_SECONDS:-60}"
            OPENCODE_INITIAL_PROVIDER: "${OPENCODE_INITIAL_PROVIDER:-}"
            OPENCODE_INITIAL_MODEL: "${OPENCODE_INITIAL_MODEL:-}"
            PROMPT_HANDLING_ENABLED: "${PROMPT_HANDLING_ENABLED:-true}"
            PROMPT_PROJECT_AGENTS_ENABLED: "${PROMPT_PROJECT_AGENTS_ENABLED:-true}"
            PROMPT_NOTECARD_REQUIRE_HANDLER: "${PROMPT_NOTECARD_REQUIRE_HANDLER:-true}"
            OPENSIM_NETWORK: "${OPENSIM_NETWORK:-${COMPOSE_PROJECT_NAME:-opensim-ai}_default}"
            COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-opensim-ai}"
            BLENDER_MCP_PORT: "${BLENDER_MCP_PORT:-8996}"
            WEAR_FOLDER_NAME: "${WEAR_FOLDER_NAME:-Cube Bot}"
            OPENSIM_HANDLER_CONFIG: "${OPENSIM_HANDLER_CONFIG:-/config/handlers.json}"
            METAVERSE_BRIDGE_TRUST_STATE_FILE: "${METAVERSE_BRIDGE_TRUST_STATE_FILE:-/config/bridges/{bot_uuid}.json}"
            OPENSIM_PROVISION_MODE: "${OPENSIM_PROVISION_MODE:-guided}"
        volumes:
            - opensim-config:/config
            - opensim-workspace:/workspace
            - spawner-data:/data
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "${OPENSIM_SPAWNER_HTTP_PORT:-8993}:${OPENSIM_SPAWNER_HTTP_PORT:-8993}/tcp"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'if command -v curl >/dev/null 2>&1; then curl -fsS "http://127.0.0.1:${OPENSIM_SPAWNER_HTTP_PORT:-8993}/ping" | grep -qx "pong"; elif command -v wget >/dev/null 2>&1; then wget -qO- "http://127.0.0.1:${OPENSIM_SPAWNER_HTTP_PORT:-8993}/ping" | grep -qx "pong"; else exit 1; fi',
                ]
            interval: 10s
            timeout: 5s
            retries: 24
            start_period: 20s
        depends_on:
            mariadb:
                condition: service_healthy
            janus:
                condition: service_started

    janus-init:
        image: "${OPENSIM_JANUS_IMAGE:-misterblue/os-webrtc-janus-docker:latest}"
        entrypoint: ["/bin/sh", "/scripts/janus-init.sh"]
        restart: "no"
        pull_policy: "${OPENSIM_PULL_POLICY:-missing}"
        environment:
            JANUS_SERVER_NAME: "${JANUS_SERVER_NAME:-GridVoice}"
            JANUS_HTTP_ENABLE: "${JANUS_HTTP_ENABLE:-true}"
            JANUS_HTTP_PORT: "${JANUS_HTTP_PORT:-14223}"
            JANUS_HTTP_BASEPATH: "${JANUS_HTTP_BASEPATH:-/voice}"
            JANUS_HTTPS_ENABLE: "${JANUS_HTTPS_ENABLE:-false}"
            JANUS_HTTPS_PORT: "${JANUS_HTTPS_PORT:-14224}"
            JANUS_HTTP_ADMIN_ENABLE: "${JANUS_HTTP_ADMIN_ENABLE:-true}"
            JANUS_HTTP_ADMIN_PORT: "${JANUS_HTTP_ADMIN_PORT:-14225}"
            JANUS_HTTP_ADMIN_BASEPATH: "${JANUS_HTTP_ADMIN_BASEPATH:-/voiceAdmin}"
            JANUS_API_TOKEN: "${JANUS_API_TOKEN:-change-me-api-token}"
            JANUS_ADMIN_TOKEN: "${JANUS_ADMIN_TOKEN:-change-me-admin-token}"
        volumes:
            - ./docker/janus-init.sh:/scripts/janus-init.sh:ro
            - opensim-janus-config:/janus-config

    janus:
        image: "${OPENSIM_JANUS_IMAGE:-misterblue/os-webrtc-janus-docker:latest}"
        restart: unless-stopped
        pull_policy: "${OPENSIM_PULL_POLICY:-missing}"
        ports:
            - "${JANUS_HTTP_PORT:-14223}:${JANUS_HTTP_PORT:-14223}/tcp"
            - "${JANUS_HTTP_ADMIN_PORT:-14225}:${JANUS_HTTP_ADMIN_PORT:-14225}/tcp"
            - "${JANUS_UDP_RTP_MIN:-10000}-${JANUS_UDP_RTP_MAX:-10200}:${JANUS_UDP_RTP_MIN:-10000}-${JANUS_UDP_RTP_MAX:-10200}/udp"
        volumes:
            - opensim-janus-config:/opt/janus/etc/janus
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'if command -v curl >/dev/null 2>&1; then curl -fsS "http://127.0.0.1:${JANUS_HTTP_PORT:-14223}${JANUS_HTTP_BASEPATH:-/voice}/info" >/dev/null; elif command -v wget >/dev/null 2>&1; then wget -qO- "http://127.0.0.1:${JANUS_HTTP_PORT:-14223}${JANUS_HTTP_BASEPATH:-/voice}/info" >/dev/null; else exit 1; fi',
                ]
            interval: 10s
            timeout: 5s
            retries: 24
            start_period: 15s
        depends_on:
            janus-init:
                condition: service_completed_successfully

    console2mcp:
        image: "${OPENSIM_CONSOLE2MCP_IMAGE:-bithatch/opensim-console2mcp:latest}"
        restart: unless-stopped
        pull_policy: "${OPENSIM_PULL_POLICY:-missing}"
        environment:
            CONSOLE_MCP_TRANSPORT: "${CONSOLE_MCP_TRANSPORT:-http}"
            CONSOLE_MCP_HOST: "${CONSOLE_MCP_HOST:-0.0.0.0}"
            CONSOLE_MCP_PORT: "${CONSOLE_MCP_PORT:-8997}"
            OPENSIM_CONSOLE_URL: "${OPENSIM_CONSOLE_URL:-http://${OPENSIM_GRID_SERVICES:-${COMPOSE_PROJECT_NAME:-opensim-ai}-grid-services}:9000}"
            OPENSIM_CONSOLE_USER: "${OPENSIM_CONSOLE_USER:-ConsoleUser}"
            OPENSIM_CONSOLE_PASS: "${OPENSIM_CONSOLE_PASS:-ConsolePass}"
        depends_on:
            spawner:
                condition: service_healthy

    blender:
        image: "${OPENSIM_BLENDER_IMAGE:-bithatch/opensim-blender:latest}"
        restart: unless-stopped
        pull_policy: "${OPENSIM_PULL_POLICY:-missing}"
        environment:
            BLENDER_MCP_HOST: "${BLENDER_MCP_HOST:-0.0.0.0}"
            BLENDER_MCP_PORT: "${BLENDER_MCP_PORT:-8996}"
            BLENDER_TCP_PROTOCOL_HOST: "${BLENDER_TCP_PROTOCOL_HOST:-127.0.0.1}"
            BLENDER_TCP_PROTOCOL_PORT: "${BLENDER_TCP_PROTOCOL_PORT:-9876}"
            BLENDER_PROJECT_DIR: "${BLENDER_PROJECT_DIR:-/workspace}"
            BLENDER_EXTRA_ARGS: "${BLENDER_EXTRA_ARGS:-}"
        volumes:
            - opensim-workspace:/workspace
            - blender-config:/root/.config/blender
            - blender-cache:/root/.cache/blender
            - blender-data:/root/.local/share/blender
        depends_on:
            spawner:
                condition: service_healthy

    piper:
        image: "${OPENSIM_PIPER_IMAGE:-bithatch/opensim-piper:latest}"
        restart: unless-stopped
        pull_policy: "${OPENSIM_PULL_POLICY:-missing}"
        environment:
            PIPER_HTTP_HOST: "${PIPER_HTTP_HOST:-0.0.0.0}"
            PIPER_HTTP_PORT: "${PIPER_HTTP_PORT:-8995}"
            PIPER_DEFAULT_VOICE: "${PIPER_DEFAULT_VOICE:-en_US-lessac-medium}"
            PIPER_TIMEOUT_SECONDS: "${PIPER_TIMEOUT_SECONDS:-60}"
        volumes:
            - piper-voices:/voices

volumes:
    opensim-mariadb:
    opensim-workspace:
    opensim-templates:
    opensim-config:
    opensim-assetcache:
    opensim-maptiles:
    spawner-data:
    blender-config:
    blender-cache:
    blender-data:
    piper-voices:
    opensim-janus-config:

networks:
    default:
        name: "${OPENSIM_NETWORK:-${COMPOSE_PROJECT_NAME:-opensim-ai}_default}"
