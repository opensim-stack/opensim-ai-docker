services:
  opensim-osgrid-init:
    build:
      context: .
      target: osgrid-runtime
      args:
        OSGRID_RELEASE_URL: "${OSGRID_RELEASE_URL:-https://download.osgrid.org/osgrid-opensim-04172026.v0.9.3.ef8a36b.zip}"
    image: "${OPENSIM_OSGRID_IMAGE:-opensim-ai-osgrid:latest}"

  opensim:
    build:
      context: .
      target: osgrid-runtime
      args:
        OSGRID_RELEASE_URL: "${OSGRID_RELEASE_URL:-https://download.osgrid.org/osgrid-opensim-04172026.v0.9.3.ef8a36b.zip}"
    image: "${OPENSIM_OSGRID_IMAGE:-opensim-ai-osgrid:latest}"

  opensim-opencode:
    build:
      context: ../opensim-opencode
    image: "${OPENCODE_IMAGE:-opensim-opencode:latest}"

  opensim-console2mcp:
    build:
      context: ../opensim-console2mcp
    image: "${OPENSIM_CONSOLE2MCP_IMAGE:-opensim-console2mcp:latest}"

  opensim-metaverse2mcp:
    build:
      context: ../opensim-metaverse2mcp
    image: "${OPENSIM_METAVERSE2MCP_IMAGE:-opensim-metaverse2mcp:latest}"
