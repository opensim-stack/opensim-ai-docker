[Const]
    BaseHostname = "${OPENSIM_HOSTNAME}"
    BaseURL = http://${Const|BaseHostname}
    PublicPort = "9000"
    PrivURL = ${Const|BaseURL}
    PrivatePort = "8003"

[Startup]
    console = ${OPENSIM_CONSOLE_MODE}
    startup_console_commands_file = "startup_commands.txt"
    shutdown_console_commands_file = "shutdown_commands.txt"

[Network]
    http_listener_port = 9000
    ConsoleUser = "${OPENSIM_CONSOLE_USER}"
    ConsolePass = "${OPENSIM_CONSOLE_PASS}"

[Estates]
    DefaultEstateName = "${OPENSIM_ESTATE_NAME}"
    DefaultEstateOwnerName = "${OPENSIM_ESTATE_OWNER_FIRST} ${OPENSIM_ESTATE_OWNER_LAST}"
    DefaultEstateOwnerEMail = "${OPENSIM_ESTATE_OWNER_EMAIL}"
    DefaultEstateOwnerPassword = "${OPENSIM_ESTATE_OWNER_PASSWORD}"
    DefaultEstateOwnerUUID = "${OPENSIM_ESTATE_OWNER_UUID}"

[Architecture]
    Include-Architecture = "config-include/Standalone.ini"
