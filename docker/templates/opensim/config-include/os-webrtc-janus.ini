[WebRtcVoice]
    Enabled = ${OPENSIM_WEBRTC_VOICE_ENABLED}
    SpatialVoiceService = WebRtcJanusService.dll:WebRtcJanusService
    NonSpatialVoiceService = WebRtcJanusService.dll:WebRtcJanusService
    WebRtcVoiceServerURI = ${Const|PrivURL}:${Const|PrivatePort}
    MessageDetails = false

[JanusWebRtcVoice]
    JanusGatewayURI = http://${OPENSIM_JANUS_PUBLIC_HOST}:${JANUS_HTTP_PORT}${JANUS_HTTP_BASEPATH}
    APIToken = ${JANUS_API_TOKEN}
    JanusGatewayAdminURI = http://${OPENSIM_JANUS_PUBLIC_HOST}:${JANUS_HTTP_ADMIN_PORT}${JANUS_HTTP_ADMIN_BASEPATH}
    AdminAPIToken = ${JANUS_ADMIN_TOKEN}
    MessageDetails = false
