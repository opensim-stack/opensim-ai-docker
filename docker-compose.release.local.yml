services:
    opensim-init:
        build:
            context: .
            target: release-runtime
            args:
                OPENSIM_RELEASE_URL: "${OPENSIM_RELEASE_URL:-https://github.com/opensim/opensim/releases/download/${OPENSIM_RELEASE_REF:-r78cb44c}/LastDotNetBuild.zip}"
        image: "${OPENSIM_RELEASE_IMAGE:-opensim-ai-standalone:latest}"

    opensim:
        build:
            context: .
            target: release-runtime
            args:
                OPENSIM_RELEASE_URL: "${OPENSIM_RELEASE_URL:-https://github.com/opensim/opensim/releases/download/${OPENSIM_RELEASE_REF:-r78cb44c}/LastDotNetBuild.zip}"
        image: "${OPENSIM_RELEASE_IMAGE:-opensim-ai-standalone:latest}"

    opensim-console2mcp:
        build:
            context: ../opensim-console2mcp
        image: "${OPENSIM_CONSOLE2MCP_IMAGE:-opensim-console2mcp:latest}"

    opensim-blender:
        build:
            context: ../opensim-blender
        image: "${OPENSIM_BLENDER_IMAGE:-opensim-blender:latest}"

    opensim-piper:
        build:
            context: ../opensim-piper
        image: "${OPENSIM_PIPER_IMAGE:-opensim-piper:latest}"
