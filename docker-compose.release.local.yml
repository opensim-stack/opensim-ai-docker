services:
  opensim-init:
    build:
      context: .
      target: release-runtime
      args:
        OPENSIM_RELEASE_URL: "${OPENSIM_RELEASE_URL:-http://opensimulator.org/dist/opensim-0.9.3.0.tar.gz}"
    image: "${OPENSIM_RELEASE_IMAGE:-opensim-ai-standalone:latest}"

  opensim:
    build:
      context: .
      target: release-runtime
      args:
        OPENSIM_RELEASE_URL: "${OPENSIM_RELEASE_URL:-http://opensimulator.org/dist/opensim-0.9.3.0.tar.gz}"
    image: "${OPENSIM_RELEASE_IMAGE:-opensim-ai-standalone:latest}"

  opensim-opencode:
    build:
      context: ../opensim-opencode
    image: "${OPENCODE_IMAGE:-opensim-opencode:latest}"

  opensim-console2mcp:
    build:
      context: ../opensim-console2mcp
    image: "${OPENSIM_CONSOLE2MCP_IMAGE:-opensim-console2mcp:latest}"

  opensim-metaverse2mcp:
    build:
      context: ../opensim-metaverse2mcp
    image: "${OPENSIM_METAVERSE2MCP_IMAGE:-opensim-metaverse2mcp:latest}"
